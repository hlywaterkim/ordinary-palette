<!doctype html>
<!--
  ORDINARY series cover: an ordinary chair on a hill under a dreamy sky, with film grain and ordered dither.
  Everything is drawn on a canvas from a fixed seed, so the same file always renders the same image.
  Render the .cover element at 1280 × 640 with device scale 2, after body[data-ready], and save it as
  docs/cover.jpg (JPEG). For another title in the series, change TITLE and the colors in COLOR.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ORDINARY cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #ffffff; }
  .cover { width: 1280px; height: 640px; }
  .cover canvas { display: block; width: 1280px; height: 640px; }
</style>
</head>
<body>
<div class="cover"><canvas></canvas></div>
<script>
const TITLE = ["ORDINARY", "PALETTE"];
const FONT = '800 104px "Plus Jakarta Sans"';
// Palette colors (ordinary-palette light scale).
const COLOR = {
  skyTop: "#5fa4ff",     // blue 400
  skyMid: "#8abeff",     // blue 300
  skyLow: "#b0d6ff",     // blue 200
  horizon: "#d5eaff",    // blue 100
  cloud: "#ffffff",
  cloudShade: "#d2d6db", // cool-gray 300
  hillLight: "#739c00",  // light-green 500
  hillDark: "#234200",   // light-green 900
  grassTip: "#c8daa7",   // light-green 200
  grass: "#8cb809",      // light-green 400
  grassDeep: "#325600",  // light-green 800
  grassCool: "#00723c",  // green 700
  wood: "#c1956f",       // brown 400
  woodShade: "#91633e",  // brown 600
  woodDeep: "#5f3b20",   // brown 800
  flower: "#ff95be",     // pink 300
  flowerSoft: "#f9bfd3", // pink 200
  lavender: "#b4abff",   // purple 300
  title: "#ffffff",
};
const W = 1280;
const H = 640;
const SCALE = 2;
const GRAIN = 9;      // grain strength in 0–255 units
const LEVELS = 12;    // color levels per channel for the dither
const DITHER_PX = 2;  // one dither cell in CSS pixels, big enough to read when the README scales the image down

// Seeded random numbers, so every render is the same image.
let seed = 20260923;
function rand() {
  seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const between = (a, b) => a + rand() * (b - a);

function layer() {
  const canvas = document.createElement("canvas");
  canvas.width = W * SCALE;
  canvas.height = H * SCALE;
  const ctx = canvas.getContext("2d");
  ctx.scale(SCALE, SCALE);
  return { canvas, ctx };
}

function paste(ctx, source, blur = 0, alpha = 1, mode = "source-over") {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.filter = blur ? `blur(${blur * SCALE}px)` : "none";
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = mode;
  ctx.drawImage(source, 0, 0);
  ctx.restore();
}

function sky(ctx) {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.78);
  g.addColorStop(0, COLOR.skyTop);
  g.addColorStop(0.4, COLOR.skyMid);
  g.addColorStop(0.75, COLOR.skyLow);
  g.addColorStop(1, COLOR.horizon);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // Soft haze and a low warm sun on the right.
  ctx.fillStyle = "rgb(247 248 250 / 0.22)";
  ctx.fillRect(0, 0, W, H);
  const sun = ctx.createRadialGradient(1010, 430, 10, 1010, 430, 520);
  sun.addColorStop(0, "rgb(255 244 228 / 0.75)");
  sun.addColorStop(1, "rgb(255 244 228 / 0)");
  ctx.fillStyle = sun;
  ctx.fillRect(0, 0, W, H);
}

// A cumulus cloud from overlapping billows, lit from the upper right, with a flat shaded base.
function cloud(target, cx, baseY, width, height, count, blur) {
  const { canvas, ctx } = layer();
  const billows = [];
  for (let i = 0; i < count; i++) {
    const u = between(-1, 1);
    const profile = 1 - u * u;
    const r = between(12, 34) * (0.45 + profile * 0.8) * (width / 380);
    billows.push({ x: cx + u * width * 0.5, y: baseY - r * 0.4 - rand() * height * profile * 0.75, r });
  }
  billows.sort((a, b) => b.y - a.y);
  for (const { x, y, r } of billows) {
    const g = ctx.createRadialGradient(x + r * 0.35, y - r * 0.45, r * 0.1, x, y, r * 1.05);
    g.addColorStop(0, COLOR.cloud);
    g.addColorStop(0.55, "#f7f8fa");
    g.addColorStop(1, COLOR.cloudShade);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  // Cool shade along the base, then fade the base out so it reads as a soft flat bottom.
  ctx.globalCompositeOperation = "source-atop";
  const shade = ctx.createLinearGradient(0, baseY - height * 0.5, 0, baseY + 6);
  shade.addColorStop(0, "rgb(160 178 200 / 0)");
  shade.addColorStop(1, "rgb(160 178 200 / 0.55)");
  ctx.fillStyle = shade;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "destination-out";
  const base = ctx.createLinearGradient(0, baseY - 18, 0, baseY + 10);
  base.addColorStop(0, "rgb(0 0 0 / 0)");
  base.addColorStop(1, "rgb(0 0 0 / 1)");
  ctx.fillStyle = base;
  ctx.fillRect(0, baseY - 18, W, H);
  paste(target, canvas, blur, 0.96);
}

const hillY = (x) => 466 + (x < 650 ? 0.00027 : 0.0002) * (x - 650) ** 2 + 5 * Math.sin(x / 83) + 3 * Math.sin(x / 31 + 1);

function hill(ctx) {
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 4) ctx.lineTo(x, hillY(x));
  ctx.lineTo(W, H);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, 460, 0, H);
  g.addColorStop(0, COLOR.grassDeep);
  g.addColorStop(0.5, COLOR.hillDark);
  g.addColorStop(1, "#1a3000");
  ctx.fillStyle = g;
  ctx.fill();
  ctx.save();
  ctx.clip();
  // Sunlit top of the hill, warmer toward the sun on the right.
  const rim = ctx.createRadialGradient(820, 470, 20, 820, 470, 520);
  rim.addColorStop(0, "rgb(140 184 9 / 0.55)");
  rim.addColorStop(0.5, "rgb(115 156 0 / 0.2)");
  rim.addColorStop(1, "rgb(115 156 0 / 0)");
  ctx.fillStyle = rim;
  ctx.fillRect(0, 400, W, H);
  ctx.restore();
  // Grass over the body of the hill.
  ctx.lineCap = "round";
  for (let i = 0; i < 5200; i++) {
    const x = between(-10, W + 10);
    const y = between(hillY(x) + 4, H + 10);
    const depth = (y - hillY(x)) / (H - hillY(x) + 1);
    const h = between(3, 9) * (1 + depth * 1.4);
    ctx.strokeStyle = rand() < 0.35 ? COLOR.hillLight : rand() < 0.5 ? COLOR.grassDeep : COLOR.grassCool;
    ctx.globalAlpha = between(0.25, 0.6) * (1 - depth * 0.5);
    ctx.lineWidth = between(0.6, 1.2);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + between(-2.5, 2.5), y - h);
    ctx.stroke();
  }
  // Backlit fringe along the crest.
  for (let x = -4; x < W + 4; x += 1.1) {
    const y = hillY(x) + between(0, 5);
    const h = between(4, 15) * (rand() < 0.08 ? 1.8 : 1);
    ctx.strokeStyle = rand() < 0.55 ? COLOR.grassTip : COLOR.grass;
    ctx.globalAlpha = between(0.45, 0.9);
    ctx.lineWidth = between(0.5, 1);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + between(-2, 2), y - h * 0.6, x + between(-4, 4), y - h);
    ctx.stroke();
  }
  // Small wild flowers.
  for (let i = 0; i < 260; i++) {
    const x = between(0, W);
    const y = hillY(x) + between(-4, 1) + rand() ** 2 * 110;
    ctx.fillStyle = [COLOR.flowerSoft, COLOR.flower, "#ffffff", COLOR.lavender][Math.floor(rand() * 4)];
    ctx.globalAlpha = between(0.5, 0.95);
    ctx.beginPath();
    ctx.arc(x, y, between(0.7, 1.9), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// A plain ladder-back chair in three-quarter view, standing on the crest.
function chair(target, footX) {
  const { canvas, ctx } = layer();
  const ground = hillY(footX) + 2;
  ctx.translate(footX, ground);
  ctx.scale(1.35, 1.35);
  const bar = (x1, y1, x2, y2, width, color) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "butt";
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  };
  // Legs further away first.
  bar(14, -9, 14, -34, 2.4, COLOR.woodShade);   // back right leg
  bar(44, -5, 44, -30, 2.4, COLOR.woodShade);   // front right leg
  bar(14, -18, 44, -14, 1.4, COLOR.woodDeep);   // right stretcher
  // Back posts and slats.
  bar(0, -4, 0, -66, 2.8, COLOR.wood);
  bar(14, -34, 14, -70, 2.6, COLOR.woodShade);
  bar(0, -62, 14, -66, 5.5, COLOR.wood);
  bar(0, -50, 14, -54, 4.2, COLOR.wood);
  // Seat.
  ctx.fillStyle = COLOR.wood;
  ctx.beginPath();
  ctx.moveTo(0, -31); ctx.lineTo(14, -35); ctx.lineTo(45, -31); ctx.lineTo(31, -27);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = COLOR.woodShade;
  ctx.beginPath();
  ctx.moveTo(0, -31); ctx.lineTo(31, -27); ctx.lineTo(45, -31); ctx.lineTo(45, -28.5); ctx.lineTo(31, -24.5); ctx.lineTo(0, -28.5);
  ctx.closePath();
  ctx.fill();
  // Near legs and stretchers.
  bar(31, 0, 31, -25, 2.6, COLOR.wood);
  bar(0, -14, 31, -10, 1.5, COLOR.woodShade);
  bar(31, -12, 44, -15, 1.4, COLOR.woodShade);
  paste(target, canvas, 0.35);
}

// Out-of-focus flowers and grass close to the lens.
function foreground(target) {
  const { canvas, ctx } = layer();
  const blobs = [
    [50, 560, 70, 38, COLOR.flower], [170, 630, 96, 44, COLOR.flowerSoft], [0, 470, 56, 42, COLOR.flower],
    [285, 590, 46, 26, COLOR.flower], [1210, 585, 84, 42, COLOR.flower], [1080, 640, 100, 44, COLOR.flowerSoft],
    [1280, 490, 52, 36, COLOR.flowerSoft], [950, 615, 44, 24, COLOR.lavender], [380, 650, 70, 30, COLOR.flower],
    [1150, 520, 34, 20, COLOR.flowerSoft], [120, 505, 30, 18, COLOR.flowerSoft],
  ];
  for (const [x, y, rx, ry, color] of blobs) {
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, between(-0.4, 0.4), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 0.85;
  ctx.lineCap = "round";
  for (let i = 0; i < 90; i++) {
    const x = rand() < 0.5 ? between(-20, 330) : between(930, W + 20);
    ctx.strokeStyle = rand() < 0.6 ? COLOR.hillDark : COLOR.grassDeep;
    ctx.lineWidth = between(3, 7);
    ctx.beginPath();
    ctx.moveTo(x, H + 20);
    ctx.quadraticCurveTo(x + between(-20, 20), H - 60, x + between(-40, 40), H - between(90, 190));
    ctx.stroke();
  }
  paste(target, canvas, 14, 1);
  // Warm bokeh dots.
  const { canvas: dots, ctx: d } = layer();
  for (let i = 0; i < 26; i++) {
    const x = rand() < 0.5 ? between(0, 360) : between(900, W);
    d.fillStyle = rand() < 0.5 ? "rgb(255 236 214 / 0.5)" : "rgb(249 191 211 / 0.45)";
    d.beginPath();
    d.arc(x, between(520, H), between(5, 16), 0, Math.PI * 2);
    d.fill();
  }
  paste(target, dots, 4, 0.8);
}

function title(ctx) {
  ctx.save();
  ctx.font = FONT;
  ctx.letterSpacing = "-3px";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.shadowColor = "rgb(0 50 114 / 0.28)";
  ctx.shadowBlur = 36 * SCALE;
  ctx.fillStyle = COLOR.title;
  ctx.fillText(TITLE[0], W / 2, 196);
  ctx.fillText(TITLE[1], W / 2, 296);
  ctx.restore();
}

// Film grain, then ordered (Bayer 4 × 4) dither down to a few levels per channel.
function grainAndDither(ctx) {
  const image = ctx.getImageData(0, 0, W * SCALE, H * SCALE);
  const px = image.data;
  const bayer = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const step = 255 / (LEVELS - 1);
  const cell = DITHER_PX * SCALE;
  for (let y = 0; y < H * SCALE; y++) {
    for (let x = 0; x < W * SCALE; x++) {
      const i = (y * W * SCALE + x) * 4;
      const noise = (rand() + rand() + rand() - 1.5) * 2 * GRAIN;
      const threshold = (bayer[((Math.floor(y / cell) & 3) << 2) | (Math.floor(x / cell) & 3)] + 0.5) / 16 - 0.5;
      for (let c = 0; c < 3; c++) {
        const v = px[i + c] + noise;
        px[i + c] = Math.max(0, Math.min(255, Math.round(v / step + threshold) * step));
      }
    }
  }
  ctx.putImageData(image, 0, 0);
}

async function draw() {
  await document.fonts.load(FONT);
  const canvas = document.querySelector("canvas");
  canvas.width = W * SCALE;
  canvas.height = H * SCALE;
  const ctx = canvas.getContext("2d");
  ctx.scale(SCALE, SCALE);
  sky(ctx);
  cloud(ctx, 1120, 60, 520, 90, 120, 9);     // thin, high, top right
  cloud(ctx, 150, 430, 420, 260, 260, 2.6);  // left
  cloud(ctx, 1130, 410, 460, 320, 300, 2.6); // right
  cloud(ctx, 760, 462, 280, 60, 90, 5);      // low and far, behind the hill
  cloud(ctx, 430, 466, 220, 44, 70, 5);
  hill(ctx);
  chair(ctx, 612);
  foreground(ctx);
  // Dreamy bloom: a blurred copy screened on top.
  const bloom = layer();
  paste(bloom.ctx, canvas);
  paste(ctx, bloom.canvas, 16, 0.4, "screen");
  // Lifted, slightly warm blacks like faded film.
  ctx.fillStyle = "rgb(243 229 217 / 0.1)";
  ctx.fillRect(0, 0, W, H);
  title(ctx);
  grainAndDither(ctx);
  document.body.dataset.ready = "1";
}
draw();
</script>
</body>
</html>
